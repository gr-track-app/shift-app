<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>早出表</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="header">
    <h1>早出表</h1>

    <div class="shift-switch">
      <button type="button" class="shiftBtn active" data-shift="1">1直</button>
      <button type="button" class="shiftBtn" data-shift="2">2直</button>
    </div>

    <div class="main-buttons">
      <button id="createButton" type="button" class="primary-btn">
        早出表を作成
      </button>

      <button id="educationButton" type="button" class="sub-btn">
        教育
      </button>
    </div>
  </div>

  <!-- 教育エリア（重複を削除して1つに整理） -->
  <div id="educationArea" class="education-box">
    <h3>教育設定</h3>
    <div id="educationList"></div>
    <button id="addEducationBtn" type="button">＋教育を追加</button>
  </div>

  <details class="accordion">
    <summary>メンバー・スキル管理</summary>
    <div class="accordion-body">

      <div class="add-row">
        <input id="memberInput" type="text" placeholder="名前を入力">
        <button id="addMemberBtn" type="button">追加</button>
      </div>

      <div id="memberList" class="member-list"></div>

    </div>
  </details>

  <details class="accordion">
    <summary>休み入力</summary>
    <div class="accordion-body">
      <div id="holidayArea"></div>
    </div>
  </details>

  <div class="board">
    <div id="scheduleArea"></div>
  </div>

</div>

<script src="script.js"></script>
<script src="scheduler.js"></script>

</body>
</html>
