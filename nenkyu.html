<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GR 年休管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    body {
      background: #09090b;
      color: #ffffff;
      padding: 12px;
      padding-bottom: 40px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #e60012;
      padding-bottom: 8px;
      gap: 6px;
    }
    .title-left { display: flex; align-items: center; gap: 6px; }
    .gr-badge {
      background: #e60012;
      color: #fff;
      font-weight: 900;
      font-style: italic;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 13px;
    }
    h1 { font-size: 17px; font-weight: 900; white-space: nowrap; }
    .top-btns { display: flex; gap: 6px; }
    .nav-pill {
      background: #222226;
      color: #fff;
      text-decoration: none;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #444;
      white-space: nowrap;
    }
    .nav-pill.active-set {
      background: #e60012;
      border-color: #e60012;
    }
    .month-banner {
      background: #16161a;
      border-left: 4px solid #e60012;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #ddd;
      margin-bottom: 12px;
      line-height: 1.4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .sync-tag { font-size: 11px; color: #aaa; white-space: nowrap; }

    .setup-panel {
      background: #16161a;
      border: 1px solid #e60012;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .setup-panel.hidden { display: none; }
    .setup-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; color: #fff; }
    .setup-note { font-size: 11px; color: #aaa; margin-bottom: 10px; }
    .setup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #26262c;
      gap: 6px;
    }
    .setup-name { font-size: 14px; font-weight: bold; flex: 1; }
    .setup-inputs { display: flex; align-items: center; gap: 6px; }
    .setup-field { display: flex; align-items: center; gap: 3px; font-size: 11px; color: #bbb; }
    .num-input {
      width: 52px;
      background: #09090b;
      color: #fff;
      border: 1px solid #555;
      border-radius: 5px;
      padding: 5px 4px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }
    .save-setup-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #e60012;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .member-row {
      background: #16161a;
      border: 1px solid #2c2c32;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #242429;
    }
    .member-name { font-size: 17px; font-weight: 800; }
    .status-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
    }
    .status-ok { background: #123821; color: #4ade80; border: 1px solid #22c55e; }
    .status-info { background: #1e293b; color: #60a5fa; border: 1px solid #3b82f6; }
    .status-warn { background: #3b2608; color: #fbbf24; border: 1px solid #f59e0b; }
    .status-danger { background: #3f0d12; color: #ff6b76; border: 1px solid #e60012; }

    .controls-row {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 8px;
    }
    .stat-box {
      background: #0d0d10;
      border: 1px solid #26262c;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .ctrl-label { font-size: 11px; color: #999; margin-bottom: 3px; white-space: nowrap; }
    .remain-val { font-size: 22px; font-weight: 900; color: #ffffff; line-height: 1.1; white-space: nowrap; }
    .remain-unit { font-size: 12px; font-weight: bold; color: #aaa; margin-left: 2px; }
    .ctrl-btns { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 6px; }
    .cnt-btn {
      padding: 0 10px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #242429;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .cut-val { font-size: 22px; font-weight: 900; text-align: center; white-space: nowrap; line-height: 1.1; }
    .cut-val.pending { color: #ff4d5a; }
    .cut-val.done { color: #4ade80; }
  </style>
</head>
<body>
<div class="container">
  <div class="title-row">
    <div class="title-left">
      <span class="gr-badge">GR</span>
      <h1>年休管理</h1>
    </div>
    <div class="top-btns">
      <button type="button" id="toggleSetupBtn" class="nav-pill" onclick="toggleSetupPanel()">⚙️ 日数設定</button>
      <a href="index.html" class="nav-pill">← 早出表</a>
    </div>
  </div>

  <div class="month-banner">
    <div id="monthText"></div>
    <span id="syncTag" class="sync-tag">☁️ 同期中...</span>
  </div>

  <section id="setupPanel" class="setup-panel hidden">
    <div class="setup-title">⚙️ 個人別 初期日数設定</div>
    <p class="setup-note">年明けの通知に合わせて、各自の「年休残数」と「カット0残」を入力して保存してください（0.5単位可）</p>
    <div id="setupList"></div>
    <button type="button" class="save-setup-btn" onclick="saveSetupValues()">この内容で保存する</button>
  </section>

  <main id="nenkyuList"></main>
</div>
<script>
const DB_BASE_URL = "https://" + "gr-track-app-default-rtdb.firebaseio.com";
const SHIFT_STORAGE_KEY = "gr_track_manager_data_v1";
const NENKYU_STORAGE_KEY = "gr_nenkyu_cut0_data_v1";

let allMembers = [];
let nenkyuData = {};
let isSaving = false;
let pendingSave = false;

function setSyncTag(text) {
  const el = document.getElementById("syncTag");
  if (el) el.textContent = text;
}

async function loadData() {
  setSyncTag("☁️ 読込中...");
  try {
    const shiftRes = await fetch(`${DB_BASE_URL}/shiftData.json?t=${Date.now()}`);
    const cloudShift = await shiftRes.json();
    const sourceShift = cloudShift?.shifts || JSON.parse(localStorage.getItem(SHIFT_STORAGE_KEY) || "{}")?.shifts || {};

    const list = [];
    const seen = new Set();
    ["1", "2"].forEach(shiftKey => {
      (sourceShift[shiftKey]?.members || []).forEach(name => {
        if (!seen.has(name)) {
          seen.add(name);
          list.push(name);
        }
      });
    });
    allMembers = list;

    const nenkyuRes = await fetch(`${DB_BASE_URL}/nenkyuData.json?t=${Date.now()}`);
    const cloudNenkyu = await nenkyuRes.json();
    if (cloudNenkyu) {
      nenkyuData = cloudNenkyu;
      localStorage.setItem(NENKYU_STORAGE_KEY, JSON.stringify(nenkyuData));
      setSyncTag("☁️ 同期完了");
    } else {
      const localRaw = localStorage.getItem(NENKYU_STORAGE_KEY);
      if (localRaw) {
        nenkyuData = JSON.parse(localRaw);
        await saveData();
      } else {
        setSyncTag("☁️ 同期完了");
      }
    }
  } catch (e) {
    console.error("クラウド読込エラー:", e);
    const localRaw = localStorage.getItem(NENKYU_STORAGE_KEY);
    if (localRaw) nenkyuData = JSON.parse(localRaw);
    setSyncTag("⚠️ オフライン");
  }
}

// 連打しても保存の順番が崩れないキュー保存処理
async function saveData() {
  localStorage.setItem(NENKYU_STORAGE_KEY, JSON.stringify(nenkyuData));
  if (isSaving) {
    pendingSave = true;
    return;
  }
  isSaving = true;
  setSyncTag("☁️ 保存中...");

  try {
    do {
      pendingSave = false;
      const snapshot = JSON.stringify(nenkyuData);
      await fetch(`${DB_BASE_URL}/nenkyuData.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: snapshot
      });
    } while (pendingSave);
    setSyncTag("☁️ 同期完了");
  } catch (e) {
    console.error("クラウド保存エラー:", e);
    setSyncTag("⚠️ 保存失敗");
  } finally {
    isSaving = false;
  }
}

function getMemberStat(name) {
  if (!nenkyuData[name]) {
    nenkyuData[name] = { remain: 20, cutZeroLeft: 5 };
  }
  return nenkyuData[name];
}

function toggleSetupPanel() {
  const panel = document.getElementById("setupPanel");
  const btn = document.getElementById("toggleSetupBtn");
  const isHidden = panel.classList.contains("hidden");
  if (isHidden) {
    renderSetupList();
    panel.classList.remove("hidden");
    btn.classList.add("active-set");
  } else {
    panel.classList.add("hidden");
    btn.classList.remove("active-set");
  }
}

function renderSetupList() {
  const container = document.getElementById("setupList");
  if (allMembers.length === 0) {
    container.innerHTML = `<p class="setup-note">メンバーが登録されていません</p>`;
    return;
  }
  container.innerHTML = allMembers.map((name, idx) => {
    const stat = getMemberStat(name);
    return `
      <div class="setup-row">
        <span class="setup-name">${name}</span>
        <div class="setup-inputs">
          <label class="setup-field">残<input type="number" step="0.5" min="0" id="set_rem_${idx}" class="num-input" value="${stat.remain}"></label>
          <label class="setup-field">カット0<input type="number" step="0.5" min="0" id="set_cut_${idx}" class="num-input" value="${stat.cutZeroLeft}"></label>
        </div>
      </div>
    `;
  }).join("");
}

async function saveSetupValues() {
  allMembers.forEach((name, idx) => {
    const remEl = document.getElementById(`set_rem_${idx}`);
    const cutEl = document.getElementById(`set_cut_${idx}`);
    if (remEl && cutEl) {
      const remVal = Math.max(0, parseFloat(remEl.value) || 0);
      const cutVal = Math.max(0, parseFloat(cutEl.value) || 0);
      nenkyuData[name] = {
        remain: Math.round(remVal * 10) / 10,
        cutZeroLeft: Math.round(cutVal * 10) / 10
      };
    }
  });
  await saveData();
  toggleSetupPanel();
  renderList();
}

function renderMonthBanner() {
  const month = new Date().getMonth() + 1;
  const textEl = document.getElementById("monthText");
  if (month >= 11 || month <= 3) {
    textEl.innerHTML = `🚨 <b>${month}月（警報期間）</b>：カット0未達成者は優先取得が必要です`;
  } else if (month >= 9) {
    textEl.innerHTML = `⚠️ <b>${month}月（アラート期間）</b>：9月アラート基準です`;
  } else if (month >= 6) {
    textEl.innerHTML = `📢 <b>${month}月（お知らせ期間）</b>：6月確認基準です`;
  } else {
    textEl.innerHTML = `📅 <b>${month}月</b>：早出表の年休と自動連動します`;
  }
}

function getStatusBadge(cutZeroLeft) {
  if (cutZeroLeft <= 0) return `<span class="status-badge status-ok">🟢 カット0達成</span>`;
  const month = new Date().getMonth() + 1;
  if (month >= 11 || month <= 3) return `<span class="status-badge status-danger">🚨 警報：あと${cutZeroLeft}日</span>`;
  if (month >= 9) return `<span class="status-badge status-warn">⚠️ アラート：あと${cutZeroLeft}日</span>`;
  return `<span class="status-badge status-info">カット0まで ${cutZeroLeft}日</span>`;
}

// 順番を勝手に並び替えず、メンバー登録順のまま固定表示
function renderList() {
  const container = document.getElementById("nenkyuList");
  if (allMembers.length === 0) {
    container.innerHTML = `<div class="month-banner">先に早出表アプリでメンバーを登録してください。</div>`;
    return;
  }

  container.innerHTML = allMembers.map(name => {
    const stat = getMemberStat(name);
    const cutClass = stat.cutZeroLeft <= 0 ? "done" : "pending";
    return `
      <div class="member-row">
        <div class="row-top">
          <span class="member-name">${name}</span>
          ${getStatusBadge(stat.cutZeroLeft)}
        </div>
        <div class="controls-row">
          <div class="stat-box">
            <span class="ctrl-label">年休残数</span>
            <div class="ctrl-btns">
              <button type="button" class="cnt-btn" onclick="changeBoth('${name}', -0.5)">−0.5</button>
              <div><span class="remain-val">${stat.remain}</span><span class="remain-unit">日</span></div>
              <button type="button" class="cnt-btn" onclick="changeBoth('${name}', 0.5)">＋0.5</button>
            </div>
          </div>
          <div class="stat-box">
            <span class="ctrl-label">カット0まで残り</span>
            <div><span class="cut-val ${cutClass}">${stat.cutZeroLeft}</span><span class="remain-unit">日</span></div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function changeBoth(name, delta) {
  const stat = getMemberStat(name);
  stat.remain = Math.max(0, Math.round((stat.remain + delta) * 10) / 10);
  stat.cutZeroLeft = Math.max(0, Math.round((stat.cutZeroLeft + delta) * 10) / 10);
  renderList();
  saveData();
}

document.addEventListener("DOMContentLoaded", async () => {
  renderMonthBanner();
  await loadData();
  renderList();
});
</script>
</body>
</html>
