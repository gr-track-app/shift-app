<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GR 年休管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    body {
      background: #09090b;
      color: #ffffff;
      padding: 12px;
      padding-bottom: 40px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #e60012;
      padding-bottom: 8px;
    }
    .title-left { display: flex; align-items: center; gap: 8px; }
    .gr-badge {
      background: #e60012;
      color: #fff;
      font-weight: 900;
      font-style: italic;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    h1 { font-size: 18px; font-weight: 900; }
    .back-btn {
      background: #222226;
      color: #fff;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #444;
    }
    .month-banner {
      background: #16161a;
      border-left: 4px solid #e60012;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #ddd;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .member-row {
      background: #16161a;
      border: 1px solid #2c2c32;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #242429;
    }
    .member-name { font-size: 17px; font-weight: 800; }
    .status-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
    }
    .status-ok { background: #123821; color: #4ade80; border: 1px solid #22c55e; }
    .status-info { background: #1e293b; color: #60a5fa; border: 1px solid #3b82f6; }
    .status-warn { background: #3b2608; color: #fbbf24; border: 1px solid #f59e0b; }
    .status-danger { background: #3f0d12; color: #ff6b76; border: 1px solid #e60012; }

    .controls-row {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 8px;
    }
    .stat-box {
      background: #0d0d10;
      border: 1px solid #26262c;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .ctrl-label {
      font-size: 11px;
      color: #999;
      margin-bottom: 3px;
      white-space: nowrap;
    }
    .remain-val {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      white-space: nowrap;
    }
    .remain-unit {
      font-size: 12px;
      font-weight: bold;
      color: #aaa;
      margin-left: 2px;
    }
    .ctrl-btns {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 6px;
    }
    .cnt-btn {
      padding: 0 10px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #242429;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .cut-val {
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
      line-height: 1.1;
    }
    .cut-val.pending { color: #ff4d5a; }
    .cut-val.done { color: #4ade80; }
  </style>
</head>
<body>
<div class="container">
  <div class="title-row">
    <div class="title-left">
      <span class="gr-badge">GR</span>
      <h1>年休管理</h1>
    </div>
    <a href="index.html" class="back-btn">← 早出表へ戻る</a>
  </div>

  <div id="monthBanner" class="month-banner"></div>
  <main id="nenkyuList"></main>
</div>
<script>
const SHIFT_STORAGE_KEY = "gr_track_manager_data_v1";
const NENKYU_STORAGE_KEY = "gr_nenkyu_cut0_data_v1";

let allMembers = [];
let nenkyuData = {};

function loadData() {
  try {
    const rawShift = localStorage.getItem(SHIFT_STORAGE_KEY);
    const list = [];
    const seen = new Set();
    if (rawShift) {
      const parsed = JSON.parse(rawShift);
      const s = parsed.shifts || parsed;
      ["1", "2"].forEach(shiftKey => {
        (s[shiftKey]?.members || []).forEach(name => {
          if (!seen.has(name)) {
            seen.add(name);
            list.push(name);
          }
        });
      });
    }
    allMembers = list;

    const rawNenkyu = localStorage.getItem(NENKYU_STORAGE_KEY);
    if (rawNenkyu) {
      const parsedN = JSON.parse(rawNenkyu);
      if (parsedN["1"] || parsedN["2"]) {
        nenkyuData = { ...(parsedN["1"] || {}), ...(parsedN["2"] || {}) };
      } else {
        nenkyuData = parsedN;
      }
    }
  } catch (e) {
    console.error(e);
  }
}

function saveData() {
  localStorage.setItem(NENKYU_STORAGE_KEY, JSON.stringify(nenkyuData));
}

function getMemberStat(name) {
  if (!nenkyuData[name]) {
    nenkyuData[name] = { remain: 20, cutZeroLeft: 5 };
  }
  return nenkyuData[name];
}

function renderMonthBanner() {
  const month = new Date().getMonth() + 1;
  const banner = document.getElementById("monthBanner");
  if (month >= 11 || month <= 3) {
    banner.innerHTML = `🚨 <b>${month}月（警報期間）</b>：カット0未達成者は優先取得が必要です`;
  } else if (month >= 9) {
    banner.innerHTML = `⚠️ <b>${month}月（アラート期間）</b>：9月アラート基準です`;
  } else if (month >= 6) {
    banner.innerHTML = `📢 <b>${month}月（お知らせ期間）</b>：6月確認基準です`;
  } else {
    banner.innerHTML = `📅 <b>${month}月</b>：早出表作成の年休チェックと自動連動します`;
  }
}

function getStatusBadge(cutZeroLeft) {
  if (cutZeroLeft <= 0) return `<span class="status-badge status-ok">🟢 カット0達成</span>`;
  const month = new Date().getMonth() + 1;
  if (month >= 11 || month <= 3) return `<span class="status-badge status-danger">🚨 警報：あと${cutZeroLeft}日</span>`;
  if (month >= 9) return `<span class="status-badge status-warn">⚠️ アラート：あと${cutZeroLeft}日</span>`;
  return `<span class="status-badge status-info">カット0まで ${cutZeroLeft}日</span>`;
}

function renderList() {
  const container = document.getElementById("nenkyuList");
  if (allMembers.length === 0) {
    container.innerHTML = `<div class="month-banner">先に早出表アプリでメンバーを登録してください。</div>`;
    return;
  }

  const sorted = [...allMembers].sort((a, b) => {
    return getMemberStat(b).cutZeroLeft - getMemberStat(a).cutZeroLeft;
  });

  container.innerHTML = sorted.map(name => {
    const stat = getMemberStat(name);
    const cutClass = stat.cutZeroLeft <= 0 ? "done" : "pending";
    return `
      <div class="member-row">
        <div class="row-top">
          <span class="member-name">${name}</span>
          ${getStatusBadge(stat.cutZeroLeft)}
        </div>
        <div class="controls-row">
          <div class="stat-box">
            <span class="ctrl-label">年休残数</span>
            <div class="ctrl-btns">
              <button type="button" class="cnt-btn" onclick="changeBoth('${name}', -0.5)">−0.5</button>
              <div><span class="remain-val">${stat.remain}</span><span class="remain-unit">日</span></div>
              <button type="button" class="cnt-btn" onclick="changeBoth('${name}', 0.5)">＋0.5</button>
            </div>
          </div>
          <div class="stat-box">
            <span class="ctrl-label">カット0まで残り</span>
            <div><span class="cut-val ${cutClass}">${stat.cutZeroLeft}</span><span class="remain-unit">日</span></div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function changeBoth(name, delta) {
  const stat = getMemberStat(name);
  stat.remain = Math.max(0, Math.round((stat.remain + delta) * 10) / 10);
  stat.cutZeroLeft = Math.max(0, Math.round((stat.cutZeroLeft + delta) * 10) / 10);
  saveData();
  renderList();
}

document.addEventListener("DOMContentLoaded", () => {
  loadData();
  renderMonthBanner();
  renderList();
});
</script>
</body>
</html>
