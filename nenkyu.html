<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GR 年休・カット0管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    body {
      background-color: #09090b;
      background-image: radial-gradient(circle at top, #1c1012 0%, #09090b 65%);
      color: #ffffff;
      padding: 12px;
      padding-bottom: 40px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .header { margin-bottom: 14px; }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #e60012;
      padding-bottom: 8px;
    }
    .title-left { display: flex; align-items: center; gap: 8px; }
    .gr-badge {
      background: linear-gradient(135deg, #ff1a2c, #b8000e);
      color: #fff;
      font-weight: 900;
      font-style: italic;
      padding: 2px 9px;
      border-radius: 4px;
      font-size: 15px;
    }
    h1 { font-size: 18px; font-weight: 900; }
    .back-btn {
      background: #222226;
      color: #fff;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #444;
    }
    .shift-switch { display: flex; gap: 8px; margin-bottom: 12px; }
    .shiftBtn {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #2e2e32;
      background: #141417;
      color: #888;
      cursor: pointer;
    }
    .shiftBtn.active {
      background: #ffffff;
      color: #09090b;
      border-color: #ffffff;
    }
    .month-banner {
      background: #18181c;
      border: 1px solid #333;
      border-left: 4px solid #e60012;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #ddd;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .member-card {
      background: #16161a;
      border: 1px solid #2e2e34;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #26262c;
    }
    .member-name { font-size: 17px; font-weight: 800; }
    .status-badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 800;
    }
    .status-ok { background: #123821; color: #4ade80; border: 1px solid #22c55e; }
    .status-info { background: #1e293b; color: #60a5fa; border: 1px solid #3b82f6; }
    .status-warn { background: #3b2608; color: #fbbf24; border: 1px solid #f59e0b; }
    .status-danger { background: #3f0d12; color: #ff6b76; border: 1px solid #e60012; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: #0e0e11;
      border: 1px solid #2a2a30;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .stat-label { font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .stat-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .cnt-btn {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #222226;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }
    .stat-val { font-size: 18px; font-weight: 900; min-width: 36px; }
    .use-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222226;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="title-row">
      <div class="title-left">
        <span class="gr-badge">GR</span>
        <h1>年休・カット0管理</h1>
      </div>
      <a href="index.html" class="back-btn">← 早出表へ戻る</a>
    </div>

    <div class="shift-switch">
      <button type="button" class="shiftBtn active" data-shift="1">1直</button>
      <button type="button" class="shiftBtn" data-shift="2">2直</button>
    </div>

    <div id="monthBanner" class="month-banner"></div>
  </header>

  <main id="nenkyuList"></main>
</div>
<script>
const SHIFT_STORAGE_KEY = "gr_track_manager_data_v1";
const NENKYU_STORAGE_KEY = "gr_nenkyu_cut0_data_v1";

let currentShift = "1";
let membersByShift = { "1": [], "2": [] };
let nenkyuData = { "1": {}, "2": {} };

function loadData() {
  try {
    const rawShift = localStorage.getItem(SHIFT_STORAGE_KEY);
    if (rawShift) {
      const parsed = JSON.parse(rawShift);
      const s = parsed.shifts || parsed;
      if (s["1"]?.members) membersByShift["1"] = s["1"].members;
      if (s["2"]?.members) membersByShift["2"] = s["2"].members;
    }
    const rawNenkyu = localStorage.getItem(NENKYU_STORAGE_KEY);
    if (rawNenkyu) {
      nenkyuData = { ...nenkyuData, ...JSON.parse(rawNenkyu) };
    }
  } catch (e) {
    console.error(e);
  }
}

function saveData() {
  localStorage.setItem(NENKYU_STORAGE_KEY, JSON.stringify(nenkyuData));
}

function getMemberStat(shift, name) {
  if (!nenkyuData[shift]) nenkyuData[shift] = {};
  if (!nenkyuData[shift][name]) {
    // 初期値：残数20日、カット0まであと5日
    nenkyuData[shift][name] = { remain: 20, cutZeroLeft: 5 };
  }
  return nenkyuData[shift][name];
}

function renderMonthBanner() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const banner = document.getElementById("monthBanner");

  let phaseMsg = "";
  if (month >= 11 || month <= 3) {
    phaseMsg = `🚨 <b>現在 ${month}月（警報期間）</b>：カット0未達成者は優先的に年休取得が必要です！`;
  } else if (month >= 9) {
    phaseMsg = `⚠️ <b>現在 ${month}月（アラート期間）</b>：9月アラート基準です。計画的な消化を促してください。`;
  } else if (month >= 6) {
    phaseMsg = `📢 <b>現在 ${month}月（お知らせ期間）</b>：6月確認基準です。残り日数をチェックしましょう。`;
  } else {
    phaseMsg = `📅 <b>現在 ${month}月</b>：年間スケジュールに沿って計画取得を進めましょう。`;
  }
  banner.innerHTML = phaseMsg;
}

function getStatusBadge(cutZeroLeft) {
  if (cutZeroLeft <= 0) {
    return `<span class="status-badge status-ok">🟢 カット0達成✅</span>`;
  }
  const month = new Date().getMonth() + 1;
  if (month >= 11 || month <= 3) {
    return `<span class="status-badge status-danger">🚨 11月警報：あと${cutZeroLeft}日</span>`;
  }
  if (month >= 9) {
    return `<span class="status-badge status-warn">⚠️ 9月アラート：あと${cutZeroLeft}日</span>`;
  }
  if (month >= 6) {
    return `<span class="status-badge status-info">📢 6月お知らせ：あと${cutZeroLeft}日</span>`;
  }
  return `<span class="status-badge status-info">残り ${cutZeroLeft}日</span>`;
}

function renderList() {
  const container = document.getElementById("nenkyuList");
  const members = membersByShift[currentShift] || [];

  if (members.length === 0) {
    container.innerHTML = `<div class="month-banner">先に早出表アプリでメンバーを登録してください。</div>`;
    return;
  }

  container.innerHTML = members.map(name => {
    const stat = getMemberStat(currentShift, name);
    return `
      <div class="member-card">
        <div class="card-top">
          <span class="member-name">${name}</span>
          ${getStatusBadge(stat.cutZeroLeft)}
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">現在の年休残数</div>
            <div class="stat-control">
              <button type="button" class="cnt-btn" onclick="changeVal('${name}', 'remain', -1)">−</button>
              <span class="stat-val">${stat.remain}日</span>
              <button type="button" class="cnt-btn" onclick="changeVal('${name}', 'remain', 1)">＋</button>
            </div>
          </div>
          <div class="stat-box">
            <div class="stat-label">カット0まで残り</div>
            <div class="stat-control">
              <button type="button" class="cnt-btn" onclick="changeVal('${name}', 'cutZeroLeft', -1)">−</button>
              <span class="stat-val">${stat.cutZeroLeft}日</span>
              <button type="button" class="cnt-btn" onclick="changeVal('${name}', 'cutZeroLeft', 1)">＋</button>
            </div>
          </div>
        </div>
        <button type="button" class="use-btn" onclick="useOneDay('${name}')">📅 年休を1日消化（両方 −1日）</button>
      </div>
    `;
  }).join("");
}

function changeVal(name, field, delta) {
  const stat = getMemberStat(currentShift, name);
  stat[field] = Math.max(0, stat[field] + delta);
  saveData();
  renderList();
}

function useOneDay(name) {
  const stat = getMemberStat(currentShift, name);
  stat.remain = Math.max(0, stat.remain - 1);
  stat.cutZeroLeft = Math.max(0, stat.cutZeroLeft - 1);
  saveData();
  renderList();
}

document.addEventListener("DOMContentLoaded", () => {
  loadData();
  renderMonthBanner();
  renderList();

  document.querySelectorAll(".shiftBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".shiftBtn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentShift = btn.dataset.shift;
      renderList();
    });
  });
});
</script>
</body>
</html>
