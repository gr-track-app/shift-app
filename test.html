<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GR TRACK MANAGER (TEST)</title>
  <script src="https://cloudflare.com"></script>
  <style>
    :root { --bg: #0f1115; --card: #181c23; --card-2: #202631; --text: #f3f5f8; --muted: #9aa4b2; --accent: #ff4d4f; --border: #2b3240; --ok: #2ecc71; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: var(--bg); color: var(--text); padding: 14px; padding-bottom: 50px; }
    .container { max-width: 960px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; background: var(--card); padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge { background: var(--accent); color: #fff; font-weight: 800; font-size: 13px; padding: 4px 8px; border-radius: 6px; letter-spacing: 0.05em; }
    h1 { font-size: 17px; margin: 0; letter-spacing: 0.02em; }
    .test-tag { font-size: 10px; background: #f39c12; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: 800; margin-left: 6px; }
    .link-btn { background: #262d3a; color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); white-space: nowrap; }

    .shift-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; background: var(--card); padding: 6px; border-radius: 14px; border: 1px solid var(--border); }
    .shift-tab { padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 800; text-align: center; background: transparent; color: var(--muted); border: none; cursor: pointer; }
    .shift-tab.active { background: var(--accent); color: #fff; }

    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .tool-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 11px 4px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
    .tool-btn.active { border-color: var(--accent); background: rgba(255, 77, 79, 0.14); color: #fff; }
    .generate-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(255, 77, 79, 0.3); }

    .panel { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    .panel.open { display: block; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .panel-title { font-size: 15px; font-weight: 800; }
    .close-btn { background: #262d3a; color: var(--text); border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .note { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }

    .member-add { display: flex; gap: 8px; margin-bottom: 12px; }
    .member-add input { flex: 1; min-width: 0; background: #10141b; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; font-size: 15px; }
    .member-add button { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 16px; font-size: 14px; font-weight: 800; white-space: nowrap; }
    .member-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; }
    .member-chip { display: flex; justify-content: space-between; align-items: center; background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; font-size: 14px; font-weight: 600; }
    .del-btn { background: #2e3646; color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-size: 11px; }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 480px; }
    th, td { border-bottom: 1px solid var(--border); padding: 9px 4px; text-align: center; font-size: 13px; }
    th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; min-width: 85px; font-weight: 700; }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }

    .status-chip { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 32px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: #12161e; color: transparent; user-select: none; }
    .status-chip.nenkyu { background: rgba(255, 77, 79, 0.25); border-color: #ff4d4f; color: #ff7875; }
    .status-chip.tokkyu { background: rgba(52, 152, 219, 0.25); border-color: #3498db; color: #5dade2; }
    .status-chip.kyouiku { background: rgba(241, 196, 15, 0.25); border-color: #f1c40f; color: #f7dc6f; }

    .edu-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .edu-controls select { background: #10141b; color: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 700; }
    .edu-apply-btn { width: 100%; background: #d4ac0d; color: #000; border: none; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 12px; }

    .board-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
    .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .board-title { font-size: 16px; font-weight: 800; }
    .sync-badge { font-size: 11px; color: var(--muted); }
    .days-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    @media (max-width: 820px) { .days-grid { grid-template-columns: 1fr; } }

    .day-card { background: var(--card-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .day-name { font-size: 15px; font-weight: 800; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .pos-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pos-item { display: flex; align-items: center; gap: 6px; background: #131720; border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; }
    .pos-badge { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pos-item select { width: 100%; min-width: 0; background: transparent; color: var(--text); border: none; font-size: 14px; font-weight: 700; outline: none; }
    .pos-item select option { background: #181c23; color: #fff; }
    .day-off { margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--muted); line-height: 1.5; }
    .off-tag { display: inline-block; background: #262d3a; padding: 2px 6px; border-radius: 5px; margin: 2px 3px 0 0; }
    .off-tag.nen { color: #ff7875; border: 1px solid rgba(255,77,79,0.4); }
    .off-tag.tok { color: #5dade2; border: 1px solid rgba(52,152,219,0.4); }
    .off-tag.kyo { color: #f7dc6f; border: 1px solid rgba(241,196,15,0.4); }
    .empty-msg { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 14px; }

    .line-share-btn { width: 100%; background: #06C755; color: #fff; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 14px; box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3); display: none; align-items: center; justify-content: center; gap: 8px; }
    .line-share-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .capturing .sync-badge { display: none !important; }
    .capturing select { appearance: none; -webkit-appearance: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <span class="brand-badge">GR</span>
        <h1>TRACK MANAGER<span class="test-tag">TEST</span></h1>
      </div>
      <a href="nenkyu.html" class="link-btn">📊 年休管理 →</a>
    </div>

    <div class="shift-switch">
      <button class="shift-tab active" id="tab1" onclick="switchShift(1)">1直 (A・B・C・D)</button>
      <button class="shift-tab" id="tab2" onclick="switchShift(2)">2直 (A・B・C)</button>
    </div>

    <div class="toolbar">
      <button class="tool-btn" id="btnMembers" onclick="togglePanel('members')">👥 メンバー</button>
      <button class="tool-btn" id="btnOff" onclick="togglePanel('off')">📅 年休・不在</button>
      <button class="tool-btn" id="btnEdu" onclick="togglePanel('edu')">🎓 教育</button>
      <button class="tool-btn" id="btnSkill" onclick="togglePanel('skill')">⚙ スキル</button>
    </div>

    <button class="generate-btn" onclick="generateSchedule()">📝 早出表作成</button>

    <div class="panel" id="panel-members">
      <div class="panel-head"><span class="panel-title">👥 メンバー管理</span><button class="close-btn" onclick="closeAllPanels()">閉じる</button></div>
      <div class="member-add"><input type="text" id="newMemberName" placeholder="名前を入力" /><button onclick="addMember()">追加</button></div>
      <div class="member-list" id="memberList"></div>
    </div>

    <div class="panel" id="panel-off">
      <div class="panel-head"><span class="panel-title">📅 年休・特休・教育 入力</span><button class="close-btn" onclick="closeAllPanels()">閉じる</button></div>
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, set, onValue } from "https://gstatic.com";

    const firebaseConfig = { databaseURL: atob("aHR0cHM6Ly9nci10cmFjay1hcHAtZGVmYXVsdC1ydGRiLmZpcmViYXNlaW8uY29t") };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, "shiftData");

    const DAYS = ["月曜日", "火曜日", "水曜日", "木曜日", "金曜日"];
    const SHIFT_POSITIONS = { 1: ["A", "B", "C", "D"], 2: ["A", "B", "C"] };

    let currentShift = 1;
    let activePanel = null;
    let state = { 1: { members: [], skills: {}, off: {}, schedule: null }, 2: { members: [], skills: {}, off: {}, schedule: null } };

    function sortJa(arr) {
      return arr.sort((a, b) => a.localeCompare(b, "ja"));
    }

    function normalizeState(raw) {
      const base = { 1: { members: [], skills: {}, off: {}, schedule: null }, 2: { members: [], skills: {}, off: {}, schedule: null } };
      if (!raw) return base;
      for (const s of ["1", "2"]) {
        if (raw[s]) {
          base[s].members = sortJa(Array.isArray(raw[s].members) ? [...raw[s].members] : []);
          base[s].skills = raw[s].skills || {};
          base[s].off = raw[s].off || {};
          base[s].schedule = Array.isArray(raw[s].schedule) ? raw[s].schedule : null;
        }
      }
      return base;
    }

    function saveState() {
      document.getElementById("syncStatus").textContent = "☁ 保存中...";
      set(dataRef, state).then(() => {
        document.getElementById("syncStatus").textContent = "☁ 同期完了";
      }).catch(() => {
        document.getElementById("syncStatus").textContent = "⚠ 保存エラー";
      });
    }

    onValue(dataRef, (snapshot) => {
      state = normalizeState(snapshot.val());
      document.getElementById("syncStatus").textContent = "☁ 同期完了";
      renderAll();
    });

    window.switchShift = (shift) => {
      currentShift = shift;
      document.getElementById("tab1").classList.toggle("active", shift === 1);
      document.getElementById("tab2").classList.toggle("active", shift === 2);
      document.getElementById("boardTitle").textContent = `${shift}直 早出表`;
      renderAll();
    };

    window.togglePanel = (name) => {
      activePanel = (activePanel === name) ? null : name;
      ["members", "off", "edu", "skill"].forEach(p => {
        document.getElementById(`panel-${p}`).classList.toggle("open", activePanel === p);
      });
      document.getElementById("btnMembers").classList.toggle("active", activePanel === "members");
      document.getElementById("btnOff").classList.toggle("active", activePanel === "off");
      document.getElementById("btnEdu").classList.toggle("active", activePanel === "edu");
      document.getElementById("btnSkill").classList.toggle("active", activePanel === "skill");
      renderAll();
    };

    window.closeAllPanels = () => { activePanel = null; togglePanel(null); };

    window.addMember = () => {
      const input = document.getElementById("newMemberName");
      const name = input.value.trim();
      if (!name) return;
      const s = state[currentShift];
      if (s.members.includes(name)) return alert("同じ名前がすでに登録されています");
      s.members.push(name);
      sortJa(s.members);
      s.skills[name] = {};
      SHIFT_POSITIONS[currentShift].forEach(p => { s.skills[name][p] = true; });
      s.off[name] = ["", "", "", "", ""];
      input.value = "";
      saveState();
    };

    window.removeMember = (name) => {
      if (!confirm(`${name} を削除しますか？`)) return;
      const s = state[currentShift];
      s.members = s.members.filter(m => m !== name);
      delete s.skills[name];
      delete s.off[name];
      saveState();
    };

    function renderMembers() {
      const s = state[currentShift];
      document.getElementById("memberList").innerHTML = s.members.map(m => `
        <div class="member-chip"><span>${m}</span><button class="del-btn" onclick="removeMember('${m}')">削除</button></div>
      `).join("") || `<div class="note">メンバーを追加してください</div>`;
    }

    window.cycleOffStatus = (name, dayIdx) => {
      const s = state[currentShift];
      if (!s.off[name]) s.off[name] = ["", "", "", "", ""];
      const cur = s.off[name][dayIdx] || "";
      const next = cur === "" ? "年" : cur === "年" ? "特" : cur === "特" ? "教" : "";
      s.off[name][dayIdx] = next;
      saveState();
    };

    function renderOffTable() {
      const s = state[currentShift];
      if (!s.members.length) { document.getElementById("offTableWrap").innerHTML = `<div class="note">先にメンバーを追加してください</div>`; return; }
      let html = `<table><thead><tr><th>名前</th>${DAYS.map(d => `<th>${d.slice(0,1)}</th>`).join("")}</tr></thead><tbody>`;
      s.members.forEach(m => {
        const arr = s.off[m] || ["", "", "", "", ""];
        html += `<tr><td>${m}</td>${DAYS.map((_, i) => {
          const v = arr[i] || "";
          const cls = v === "年" ? "nenkyu" : v === "特" ? "tokkyu" : v === "教" ? "kyouiku" : "";
          return `<td><div class="status-chip ${cls}" onclick="cycleOffStatus('${m}', ${i})">${v || "・"}</div></td>`;
        }).join("")}</tr>`;
      });
      document.getElementById("offTableWrap").innerHTML = html + `</tbody></table>`;
    }

    function renderEduPanel() {
      const s = state[currentShift];
      const positions = SHIFT_POSITIONS[currentShift];
      const posSel = document.getElementById("eduPosSelect");
      const prevVal = posSel.value;
      posSel.innerHTML = positions.map(p => `<option value="${p}">ポジション ${p}</option>`).join("");
      if (positions.includes(prevVal)) posSel.value = prevVal;

      let listHtml = "";
      DAYS.forEach((d, i) => {
        const trainees = s.members.filter(m => (s.off[m] || [])[i] === "教");
        if (trainees.length) listHtml += `<div class="note">・<b>${d}</b>：${trainees.join("、")}</div>`;
      });
      document.getElementById("eduListWrap").innerHTML = listHtml || `<div class="note">現在「教」に設定されているメンバーはいません</div>`;
    }

    window.applyEducationToBoard = () => {
      const s = state[currentShift];
      if (!s.schedule) return alert("先に「早出表作成」を押してください");
      const dayIdx = Number(document.getElementById("eduDaySelect").value);
      const pos = document.getElementById("eduPosSelect").value;
      const trainees = s.members.filter(m => (s.off[m] || [])[dayIdx] === "教");
      if (!trainees.length) return alert(`${DAYS[dayIdx]}に「教」設定のメンバーがいません`);
      s.schedule[dayIdx][pos] = trainees.at(0);
      saveState();
      alert(`${DAYS[dayIdx]}のポジション${pos}に ${trainees.at(0)} を反映しました`);
    };

    window.toggleSkill = (name, pos) => {
      const s = state[currentShift];
      if (!s.skills[name]) s.skills[name] = {};
      s.skills[name][pos] = !s.skills[name][pos];
      saveState();
    };

    function renderSkillTable() {
      const s = state[currentShift];
      const positions = SHIFT_POSITIONS[currentShift];
      if (!s.members.length) { document.getElementById("skillTableWrap").innerHTML = `<div class="note">先にメンバーを追加してください</div>`; return; }
      let html = `<table><thead><tr><th>名前</th>${positions.map(p => `<th>${p}</th>`).join("")}</tr></thead><tbody>`;
      s.members.forEach(m => {
        html += `<tr><td>${m}</td>${positions.map(p => {
          const checked = (s.skills[m] && s.skills[m][p] !== false) ? "checked" : "";
          return `<td><input type="checkbox" ${checked} onchange="toggleSkill('${m}', '${p}')"></td>`;
        }).join("")}</tr>`;
      });
      document.getElementById("skillTableWrap").innerHTML = html + `</tbody></table>`;
    }

    window.changeAssign = (dayIdx, pos, val) => {
      state[currentShift].schedule[dayIdx][pos] = val;
      saveState();
    };

    function renderSchedule() {
      const s = state[currentShift];
      const positions = SHIFT_POSITIONS[currentShift];
      const out = document.getElementById("scheduleOutput");
      const shareBtn = document.getElementById("shareLineBtn");
      if (!s.schedule) {
        out.innerHTML = `<div class="empty-msg">「📝 早出表作成」を押してください</div>`;
        if (shareBtn) shareBtn.style.display = "none";
        return;
      }
      if (shareBtn) shareBtn.style.display = "flex";
      let html = `<div class="days-grid">`;
      DAYS.forEach((day, dIdx) => {
        const dayAssign = s.schedule[dIdx] || {};
        const offList = [];
        s.members.forEach(m => {
          const st = (s.off[m] || [])[dIdx];
          if (st === "年") offList.push(`<span class="off-tag nen">${m}(年)</span>`);
          else if (st === "特") offList.push(`<span class="off-tag tok">${m}(特)</span>`);
          else if (st === "教") offList.push(`<span class="off-tag kyo">${m}(教)</span>`);
        });

        html += `<div class="day-card"><div class="day-name"><span>${day}</span></div><div class="pos-list">`;
        positions.forEach(pos => {
          const curVal = dayAssign[pos] || "";
          const opts = [`<option value="">未定</option>`, ...s.members.map(m => `<option value="${m}" ${m === curVal ? "selected" : ""}>${m}</option>`)].join("");
          html += `<div class="pos-item"><span class="pos-badge">${pos}</span><select onchange="changeAssign(${dIdx}, '${pos}', this.value)">${opts}</select></div>`;
        });
        html += `</div>`;
        if (offList.length) html += `<div class="day-off">不在: ${offList.join("")}</div>`;
        html += `</div>`;
      });
      out.innerHTML = html + `</div>`;
    }
    window.generateSchedule = () => {
      const s = state[currentShift];
      const positions = SHIFT_POSITIONS[currentShift];
      if (s.members.length < positions.length) return alert(`最低${positions.length}人のメンバーが必要です`);

      const totalCount = {};
      const posCount = {};
      s.members.forEach(m => { totalCount[m] = 0; posCount[m] = {}; positions.forEach(p => posCount[m][p] = 0); });

      const newSchedule = [];
      let prevDayAssigned = new Set();

      for (let d = 0; d < 5; d++) {
        const dayResult = {};
        const usedToday = new Set();
        const available = s.members.filter(m => !(s.off[m] || [])[d]);
        const posOrder = [...positions].sort((a, b) => {
          const ca = available.filter(m => s.skills[m]?.[a] !== false).length;
          const cb = available.filter(m => s.skills[m]?.[b] !== false).length;
          return ca - cb;
        });

        for (const pos of posOrder) {
          const candidates = available.filter(m => !usedToday.has(m) && s.skills[m]?.[pos] !== false);
          if (!candidates.length) { dayResult[pos] = ""; continue; }
          candidates.sort((a, b) => {
            const scoreA = totalCount[a] * 100 + posCount[a][pos] * 400 + (prevDayAssigned.has(a) ? 15 : 0) + Math.random();
            const scoreB = totalCount[b] * 100 + posCount[b][pos] * 400 + (prevDayAssigned.has(b) ? 15 : 0) + Math.random();
            return scoreA - scoreB;
          });
          const chosen = candidates.at(0);
          dayResult[pos] = chosen;
          usedToday.add(chosen);
          totalCount[chosen]++;
          posCount[chosen][pos]++;
        }
        newSchedule.push(dayResult);
        prevDayAssigned = usedToday;
      }
      s.schedule = newSchedule;
      saveState();
    };

    window.shareScheduleImage = async () => {
      const btn = document.getElementById("shareLineBtn");
      const target = document.getElementById("captureArea");
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "⏳ 画像を作成中...";
      target.classList.add("capturing");

      try {
        const canvas = await html2canvas(target, {
          backgroundColor: "#0f1115",
          scale: 2,
          useCORS: true
        });
        target.classList.remove("capturing");

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        const fileName = `${currentShift}直_早出表.png`;
        const file = new File([blob], fileName, { type: "image/png" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            text: "来週の早出確認お願いします。"
          });
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName;
          a.click();
          URL.revokeObjectURL(url);
          alert("画像を保存しました。LINEを開いて画像を送信してください。");
        }
      } catch (err) {
        target.classList.remove("capturing");
        if (err.name !== "AbortError") {
          alert("画像の共有に失敗しました: " + err.message);
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    };

    function renderAll() {
      renderMembers();
      renderOffTable();
      renderEduPanel();
      renderSkillTable();
      renderSchedule();
    }

    renderAll();
  </script>
</body>
</html>
